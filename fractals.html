<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self'; script-src 'self'; font-src 'self'; img-src 'self' data:"
    />
    <title>Sort Me — fractals</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./vendor/katex/katex.min.css" />
  </head>
  <body>
    <div class="shell">
      <aside class="panel">
        <nav class="site-nav" aria-label="Sort Me pages">
          <a href="./index.html">Sorting</a>
          <a href="./fractals.html" aria-current="page">Fractals</a>
        </nav>
        <header>
          <p class="eyebrow">Self-similar</p>
          <h1>Sort Me</h1>
          <p class="lede">
            Pick a fractal and a coloring, then watch it resolve.
            Space plays, and the right arrow steps.
          </p>
        </header>

        <div class="controls">
          <label>
            Fractal
            <select id="fractal"></select>
          </label>
          <p class="formula-row">
            <span id="complexity" class="formula"></span>
          </p>
          <p id="blurb" class="blurb"></p>

          <label>
            Coloring
            <select id="palette"></select>
          </label>
          <p id="palette-blurb" class="blurb"></p>

          <div class="field">
            <div class="slider-row">
              <label id="depth-label" for="depth">Depth</label>
              <input id="depth-out" type="number" min="1" max="120" value="48" aria-label="Depth number" />
            </div>
            <input id="depth" type="range" min="1" max="120" value="48" />
          </div>

          <div class="field">
            <div class="slider-row">
              <label for="speed">Speed</label>
              <output id="speed-out" for="speed">1 / frame</output>
            </div>
            <input id="speed" type="range" min="1" max="100" value="28" />
          </div>

          <div class="row" id="presets" role="group" aria-label="Fractal presets"></div>

          <div class="row">
            <button type="button" id="toggle" class="primary">Draw</button>
            <button type="button" id="step">Step</button>
          </div>
        </div>
        <p id="error" class="error" role="alert"></p>
      </aside>

      <main class="stage">
        <div class="canvas-frame">
          <canvas id="canvas" width="900" height="520" aria-label="Fractal visualization"></canvas>
        </div>
        <aside id="viz-dock" class="viz-dock" hidden>
          <label>
            Speed
            <input id="dock-speed" type="range" min="1" max="100" value="28" aria-label="Frame speed" />
          </label>
          <button type="button" id="dock-toggle">Pause</button>
        </aside>
        <ul class="legend">
          <li><i class="swatch inside"></i> <span id="legend-a">Inside</span></li>
          <li><i class="swatch early"></i> <span id="legend-b">Early</span></li>
          <li><i class="swatch late"></i> <span id="legend-c">Late</span></li>
        </ul>
        <div id="readout" class="readout" aria-live="polite">
          <div class="stat"><span>Status</span><strong id="status">Ready</strong></div>
          <div class="stat"><span>Depth</span><strong id="depth-stat">0</strong></div>
          <div class="stat"><span>Samples</span><strong id="samples">0</strong></div>
          <div class="stat"><span>Preset</span><strong id="preset-stat">Classic</strong></div>
          <div class="stat"><span>Kind</span><strong id="kind">Escape</strong></div>
        </div>
        <p id="note" class="note"></p>
      </main>
    </div>
    <script type="module" src="./src/fractal-app.js"></script>
  </body>
</html>
